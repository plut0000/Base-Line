<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaseLine — Live MLB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d0f;--surface:#14181c;--surface-2:#1b2026;--line:rgba(255,255,255,.07);--ink:#eef2f3;--muted:#8b949c;--dim:#5f6970;--green:#1fd65f;--green-dk:#16b34d;--red:#ff4438;--gold:#ffc52f;--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:620px;margin:0 auto}
  header{position:sticky;top:0;z-index:40;background:rgba(10,13,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .head-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .logo{display:flex;align-items:center;gap:9px;font-family:'Archivo';font-weight:900;font-size:21px;letter-spacing:-.02em}
  .logo .m{width:26px;height:26px;border-radius:7px;background:var(--green);display:grid;place-items:center;box-shadow:0 0 18px rgba(31,214,95,.45)}
  .logo .m::before{content:"";width:13px;height:13px;border:2px solid #0a0d0f;border-radius:50%;border-top-color:transparent;border-right-color:transparent;transform:rotate(45deg)}
  .logo span{color:var(--green)}
  .live-dot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .live-dot i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .tabs{display:flex;gap:4px;padding:0 12px}
  .tab{flex:1;text-align:center;padding:13px 2px;font-family:'Archivo';font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:color .2s,border-color .2s;letter-spacing:-.01em}
  .tab.active{color:var(--ink);border-color:var(--green)}
  .tab:hover{color:var(--ink)}
  .panel{display:none;padding:16px 14px;animation:fade .35s var(--ease)}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  /* dates */
  .dates{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
  .dates::-webkit-scrollbar{display:none}
  .datepill{flex:none;padding:8px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s}
  .datepill.sel{background:var(--green);color:#06150b;border-color:var(--green);font-weight:700}
  .datepill .dd{font-size:11px;opacity:.7;display:block;font-weight:500}
  .datepill.sel .dd{opacity:.8}
  .daylabel{font-family:'Archivo';font-weight:700;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 10px}
  /* game cards */
  .game{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .18s,transform .18s}
  .game:hover{background:var(--surface-2);transform:translateX(2px)}
  .g-status{flex:none;width:54px;text-align:center;font-size:11px;font-weight:700;color:var(--dim);font-family:'Archivo'}
  .g-status.final{color:var(--muted)}.g-status.live{color:var(--red)}
  .g-status .inn{font-size:10px;color:var(--red);margin-top:2px}
  .g-status .time{font-size:13px;color:var(--ink);font-weight:600}
  .g-teams{flex:1;display:flex;flex-direction:column;gap:9px;border-left:1px solid var(--line);padding-left:14px}
  .g-row{display:flex;align-items:center;gap:10px}
  .badge{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:9px;color:#fff}
  .g-name{flex:1;font-size:14.5px;font-weight:600}
  .g-score{font-family:'Archivo';font-weight:800;font-size:17px;color:var(--muted);min-width:24px;text-align:right}
  .g-row.win .g-name{color:var(--ink)}.g-row.win .g-score{color:var(--ink)}
  .g-row.lose .g-name,.g-row.lose .g-score{color:var(--dim)}
  .g-win-mark{flex:none;width:5px;height:5px;border-radius:50%;background:transparent}
  .g-row.win .g-win-mark{background:var(--green)}
  /* standings */
  .seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:18px}
  .seg button{flex:1;padding:9px 0;border:none;background:transparent;color:var(--muted);font-family:'Archivo';font-weight:700;font-size:13.5px;border-radius:8px;cursor:pointer;transition:all .18s}
  .seg button.on{background:var(--green);color:#06150b}
  .div-title{font-family:'Archivo';font-weight:800;font-size:14px;margin:20px 4px 10px;display:flex;align-items:center;gap:8px}
  .div-title::before{content:"";width:3px;height:15px;background:var(--green);border-radius:2px}
  .standtable{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .st-head,.st-row{display:grid;grid-template-columns:26px 1fr 34px 34px 44px 50px;align-items:center;gap:8px;padding:11px 14px;font-size:13px}
  .st-head{color:var(--dim);font-size:10.5px;font-weight:700;font-family:'Archivo';text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  .st-row{border-bottom:1px solid var(--line)}.st-row:last-child{border-bottom:none}
  .st-row.leader{background:rgba(31,214,95,.06)}
  .st-rank{font-family:'Archivo';font-weight:700;color:var(--dim);font-size:12px}
  .st-team{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;overflow:hidden}
  .st-team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-num{text-align:center;font-family:'Archivo';font-weight:600;color:var(--muted)}
  .st-pct{text-align:center;font-family:'Archivo';font-weight:700}
  .st-gb{text-align:center;font-family:'Archivo';color:var(--muted)}
  .clinch{color:var(--green);font-size:10px}
  /* stats */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .card h3{font-family:'Archivo';font-weight:800;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .lead-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
  .lead-row:last-child{border:none;padding-bottom:0}
  .lead-rank{font-family:'Archivo';font-weight:800;font-size:15px;width:20px;color:var(--dim)}
  .lead-rank.top{color:var(--green)}
  .lead-name{flex:1;font-weight:600;font-size:14px}
  .lead-rec{font-family:'Archivo';font-weight:600;color:var(--muted);font-size:13px}
  .lead-bar{width:60px;height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
  .lead-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-dk),var(--green));border-radius:6px}
  .lead-pct{font-family:'Archivo';font-weight:800;font-size:14px;width:42px;text-align:right}
  .divgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .divcard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:13px}
  .divcard .dl{font-size:10.5px;color:var(--dim);font-weight:700;font-family:'Archivo';text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
  .divcard .dt{display:flex;align-items:center;gap:9px}
  .divcard .dt .nm{font-weight:700;font-size:14px}
  .divcard .dr{font-family:'Archivo';font-size:11.5px;color:var(--muted);margin-top:5px;margin-left:33px}
  /* player leaders */
  .pl-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
  .pl-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px}
  .pl-head h3{font-family:'Archivo';font-weight:800;font-size:15px}
  .pl-head .unit{font-family:'Archivo';font-weight:700;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .pl-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
  .pl-row.top{background:rgba(31,214,95,.06)}
  .pl-rank{font-family:'Archivo';font-weight:800;font-size:15px;width:20px;text-align:center;color:var(--dim)}
  .pl-row.top .pl-rank{color:var(--green)}
  .pl-ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:'Archivo';font-weight:800;font-size:13px;color:#fff;letter-spacing:-.03em}
  .pl-info{flex:1;min-width:0}
  .pl-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-meta{font-size:12px;color:var(--muted);margin-top:1px}
  .pl-val{font-family:'Archivo';font-weight:800;font-size:18px;color:var(--ink)}
  .pl-row.top .pl-val{color:var(--green);font-size:21px}
  /* news */
  .news-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:block;text-decoration:none;color:inherit;transition:background .18s,transform .18s}
  .news-card:hover{background:var(--surface-2);transform:translateY(-2px)}
  .news-cat{display:inline-block;font-family:'Archivo';font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin-bottom:9px}
  .news-cat.hot{color:var(--red)}.news-cat.gold{color:var(--gold)}
  .news-card h4{font-family:'Archivo';font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.01em;margin-bottom:8px}
  .news-card p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:10px}
  .news-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim)}
  .news-meta .arrow{color:var(--green);font-weight:700;font-family:'Archivo'}
  /* loading / error */
  .loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
  .loading .spin{width:32px;height:32px;border:3px solid var(--surface-2);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{text-align:center;padding:30px 20px;color:var(--muted);font-size:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .updated{text-align:center;color:var(--dim);font-size:11.5px;padding:6px 0 14px}
  footer{text-align:center;color:var(--dim);font-size:11.5px;padding:20px 18px 8px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="head-top">
    <div class="logo"><span class="m"></span>Base<span>Line</span></div>
    <div class="live-dot"><i></i>LIVE · 2026</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="scores">Scores</div>
    <div class="tab" data-tab="standings">Standings</div>
    <div class="tab" data-tab="stats">Stats</div>
    <div class="tab" data-tab="players">Players</div>
    <div class="tab" data-tab="news">News</div>
  </div>
</header>

<div class="panel active" id="scores">
  <div class="dates" id="dates"></div>
  <div id="gamesList"><div class="loading"><div class="spin"></div>Loading games…</div></div>
</div>
<div class="panel" id="standings">
  <div class="seg" id="leagueSeg">
    <button class="on" data-lg="AL">American League</button>
    <button data-lg="NL">National League</button>
  </div>
  <div id="standList"><div class="loading"><div class="spin"></div>Loading standings…</div></div>
</div>
<div class="panel" id="stats">
  <div id="statContent"><div class="loading"><div class="spin"></div>Loading stats…</div></div>
</div>
<div class="panel" id="players">
  <div class="seg" id="ptypeSeg">
    <button class="on" data-pt="bat">Batting</button>
    <button data-pt="pit">Pitching</button>
  </div>
  <div id="leaderWrap"><div class="loading"><div class="spin"></div>Loading leaders…</div></div>
</div>
<div class="panel" id="news"><div id="newsList"></div></div>
<footer>BaseLine · Live data from MLB Stats API + ESPN · Everything updates automatically.</footer>
</div>

<script>
/* ---- team colours & names ---- */
const TC={NYY:"#0C2340",BOS:"#BD3039",TB:"#092C5C",TOR:"#134A8E",BAL:"#DF4601",CLE:"#0C2340",CWS:"#1a1a1a",MIN:"#002B5C",DET:"#0C2340",KC:"#004687",SEA:"#0C2C56",TEX:"#003278",ATH:"#005C2E",HOU:"#002D62",LAA:"#BA0021",ATL:"#CE1141",PHI:"#E81828",WSH:"#AB0003",MIA:"#00A3E0",NYM:"#002D72",MIL:"#12284B",PIT:"#c99700",STL:"#C41E3A",CHC:"#0E3386",CIN:"#C6011F",LAD:"#005A9C",SD:"#4a3526",AZ:"#A71930",COL:"#333366",SF:"#FD5A1E"};
const ABBR_MAP={"PHI":"PHI","NYY":"NYY","BOS":"BOS","TB":"TB","TOR":"TOR","BAL":"BAL","CLE":"CLE","CWS":"CWS","CHW":"CWS","MIN":"MIN","DET":"DET","KC":"KC","SEA":"SEA","TEX":"TEX","ATH":"ATH","OAK":"ATH","HOU":"HOU","LAA":"LAA","ATL":"ATL","WSH":"WSH","WAS":"WSH","MIA":"MIA","NYM":"NYM","MIL":"MIL","PIT":"PIT","STL":"STL","CHC":"CHC","CIN":"CIN","LAD":"LAD","SD":"SD","ARI":"AZ","COL":"COL","SF":"SF"};
const NAMES={"NYY":"Yankees","BOS":"Red Sox","TB":"Rays","TOR":"Blue Jays","BAL":"Orioles","CLE":"Guardians","CWS":"White Sox","MIN":"Twins","DET":"Tigers","KC":"Royals","SEA":"Mariners","TEX":"Rangers","ATH":"Athletics","HOU":"Astros","LAA":"Angels","ATL":"Braves","PHI":"Phillies","WSH":"Nationals","MIA":"Marlins","NYM":"Mets","MIL":"Brewers","PIT":"Pirates","STL":"Cardinals","CHC":"Cubs","CIN":"Reds","LAD":"Dodgers","SD":"Padres","AZ":"D-backs","COL":"Rockies","SF":"Giants"};
function ab(a){return ABBR_MAP[a]||a;}
function badge(a){const k=ab(a);return `<span class="badge" style="background:${TC[k]||'#333'}">${k}</span>`;}
function teamName(a){return NAMES[ab(a)]||a;}

/* ---- date helpers ---- */
const today=new Date();
function fmtApi(d){return d.toISOString().split('T')[0];}
function fmtLabel(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function fmtDay(d){const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return days[d.getDay()];}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
const todayStr=fmtApi(today);
const DATES=[-3,-2,-1,0,1,2,3].map(n=>addDays(today,n));

/* ---- state ---- */
let curDate=todayStr;
let gamesCache={};
let standingsRaw=null;
let batLeaders=null;
let pitLeaders=null;
let curLg='AL';
let curPType='bat';

/* ---- MLB API base ---- */
const BASE='https://statsapi.mlb.com/api/v1';
const PROXY='https://corsproxy.io/?url=';
const season=today.getFullYear();
async function mlbFetch(url){
  try{const r=await fetch(url);if(r.ok)return r.json();throw new Error('direct failed');}
  catch(e){const r=await fetch(PROXY+encodeURIComponent(url));return r.json();}
}

/* ---- fetch schedule (all 7 dates at once) ---- */
async function fetchSchedule(){
  const start=fmtApi(DATES[0]),end=fmtApi(DATES[6]);
  const url=`${BASE}/schedule?sportId=1&startDate=${start}&endDate=${end}&hydrate=team,linescore&gameType=R`;
  const d=await mlbFetch(url);
  (d.dates||[]).forEach(day=>{gamesCache[day.date]=day.games||[];});
}

/* ---- fetch standings ---- */
async function fetchStandings(){
  const url=`${BASE}/standings?leagueId=103,104&season=${season}&standingsTypes=regularSeason&hydrate=team,division,league`;
  const d=await mlbFetch(url);
  standingsRaw=d.records||[];
}

/* ---- fetch stat leaders ---- */
async function fetchLeaders(){
  const batCats='homeRuns,battingAverage,rbi,hits,onBasePlusSlugging,stolenBases';
  const pitCats='earnedRunAverage,strikeOuts,wins,saves,walksAndHitsPerInningPitched';
  const [br,pr]=await Promise.all([
    mlbFetch(`${BASE}/stats/leaders?leaderCategories=${batCats}&season=${season}&leaderGameTypes=R&limit=5&hydrate=person,team`),
    mlbFetch(`${BASE}/stats/leaders?leaderCategories=${pitCats}&season=${season}&leaderGameTypes=R&limit=5&hydrate=person,team&statGroup=pitching`),
  ]);
  batLeaders=br.leagueLeaders||[];
  pitLeaders=pr.leagueLeaders||[];
}

/* ==================== RENDER ==================== */

/* dates */
function renderDates(){
  document.getElementById('dates').innerHTML=DATES.map(d=>{
    const ds=fmtApi(d);
    const isToday=ds===todayStr;
    return `<div class="datepill ${ds===curDate?'sel':''}" data-d="${ds}"><span class="dd">${fmtDay(d)}${isToday?' · Today':''}</span>${fmtLabel(d)}</div>`;
  }).join('');
  document.querySelectorAll('.datepill').forEach(p=>p.onclick=()=>{curDate=p.dataset.d;renderDates();renderGames();});
}

/* games */
function renderGames(){
  const games=gamesCache[curDate];
  const wrap=document.getElementById('gamesList');
  if(!games){wrap.innerHTML='<div class="loading"><div class="spin"></div>Loading…</div>';return;}
  if(!games.length){wrap.innerHTML='<div class="err">No games on this date.</div>';return;}

  let html=`<div class="daylabel">${games.length} games · ${fmtLabel(new Date(curDate+'T12:00:00'))}</div>`;
  games.forEach(g=>{
    const st=g.status?.abstractGameState||'Preview';
    const away=g.teams?.away;const home=g.teams?.home;
    const aAb=ab(away?.team?.abbreviation||'');const hAb=ab(home?.team?.abbreviation||'');
    const aScore=away?.score??'';const hScore=home?.score??'';
    const aWin=away?.isWinner;const hWin=home?.isWinner;
    const isFinal=st==='Final';const isLive=st==='Live';

    let statusHtml='';
    if(isFinal){
      statusHtml=`<div class="g-status final">Final</div>`;
    } else if(isLive){
      const inn=g.linescore?.currentInningOrdinal||'';
      const half=g.linescore?.inningHalf||'';
      statusHtml=`<div class="g-status live">LIVE<div class="inn">${half.slice(0,3)} ${inn}</div></div>`;
    } else {
      const t=new Date(g.gameDate);
      const ts=t.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      statusHtml=`<div class="g-status"><div class="time">${ts}</div></div>`;
    }
    const aClass=isFinal?(aWin?'win':'lose'):'';
    const hClass=isFinal?(hWin?'win':'lose'):'';
    html+=`<div class="game">${statusHtml}<div class="g-teams">
      <div class="g-row ${aClass}"><span class="g-win-mark"></span>${badge(aAb)}<span class="g-name">${teamName(aAb)}</span><span class="g-score">${isFinal||isLive?aScore:''}</span></div>
      <div class="g-row ${hClass}"><span class="g-win-mark"></span>${badge(hAb)}<span class="g-name">${teamName(hAb)}</span><span class="g-score">${isFinal||isLive?hScore:''}</span></div>
    </div></div>`;
  });
  wrap.innerHTML=html;
}

/* standings */
const DIV_ORDER={201:1,202:2,203:3,204:4,205:5,206:6};
const DIV_NAMES={201:'AL East',202:'AL Central',203:'AL West',204:'NL East',205:'NL Central',206:'NL West'};
function renderStandings(){
  if(!standingsRaw){document.getElementById('standList').innerHTML='<div class="err">Standings not loaded.</div>';return;}
  const leagueFilter=curLg==='AL'?'American League':'National League';
  const divs=standingsRaw.filter(r=>r.division?.nameShort?.includes(curLg)||r.league?.name?.includes(leagueFilter)||r.standingsType==='regularSeason').filter(r=>{
    const id=r.division?.id;return curLg==='AL'?[201,202,203].includes(id):[204,205,206].includes(id);
  }).sort((a,b)=>(DIV_ORDER[a.division?.id]||9)-(DIV_ORDER[b.division?.id]||9));

  if(!divs.length){document.getElementById('standList').innerHTML='<div class="err">No standings data.</div>';return;}
  let html='';
  divs.forEach(div=>{
    const teams=div.teamRecords||[];
    const leader=teams[0];
    html+=`<div class="div-title">${DIV_NAMES[div.division?.id]||div.division?.name||''}</div>
    <div class="standtable">
      <div class="st-head"><span></span><span>Team</span><span style="text-align:center">W</span><span style="text-align:center">L</span><span style="text-align:center">PCT</span><span style="text-align:center">GB</span></div>`;
    teams.forEach((t,i)=>{
      const a=ab(t.team?.abbreviation||'');
      html+=`<div class="st-row ${i===0?'leader':''}">
        <span class="st-rank">${i+1}</span>
        <span class="st-team">${badge(a)}<span class="nm">${teamName(a)}</span>${i===0?'<span class="clinch">●</span>':''}</span>
        <span class="st-num">${t.wins||0}</span>
        <span class="st-num">${t.losses||0}</span>
        <span class="st-pct">${t.winningPercentage||'.000'}</span>
        <span class="st-gb">${t.gamesBack||'-'}</span>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('standList').innerHTML=html;
}

/* power index from standings */
function renderStats(){
  if(!standingsRaw){document.getElementById('statContent').innerHTML='<div class="err">Stats not loaded.</div>';return;}
  const all=standingsRaw.flatMap(r=>r.teamRecords||[]).sort((a,b)=>parseFloat(b.winningPercentage||0)-parseFloat(a.winningPercentage||0)).slice(0,10);
  const top=parseFloat(all[0]?.winningPercentage||1);
  const powerRows=all.map((t,i)=>{
    const a=ab(t.team?.abbreviation||'');
    const pct=parseFloat(t.winningPercentage||0);
    return `<div class="lead-row"><span class="lead-rank ${i<3?'top':''}">${i+1}</span>${badge(a)}<span class="lead-name">${teamName(a)}</span><span class="lead-rec">${t.wins}-${t.losses}</span><span class="lead-bar"><i style="width:${(pct/top*100).toFixed(0)}%"></i></span><span class="lead-pct">${t.winningPercentage}</span></div>`;
  }).join('');

  const divLeaders=standingsRaw.filter(r=>[201,202,203,204,205,206].includes(r.division?.id)).sort((a,b)=>(DIV_ORDER[a.division?.id]||9)-(DIV_ORDER[b.division?.id]||9)).map(r=>{
    const t=r.teamRecords?.[0];if(!t)return '';
    const a=ab(t.team?.abbreviation||'');
    return `<div class="divcard"><div class="dl">${DIV_NAMES[r.division?.id]||''}</div><div class="dt">${badge(a)}<span class="nm">${teamName(a)}</span></div><div class="dr">${t.wins}-${t.losses} · ${t.winningPercentage}</div></div>`;
  }).join('');

  document.getElementById('statContent').innerHTML=`
    <div class="card"><h3>⚡ Power Index</h3><div class="sub">MLB's best records · ${season}</div>${powerRows}</div>
    <div class="card"><h3>🏆 Division Leaders</h3><div class="sub">Who's on top in each division</div><div class="divgrid">${divLeaders}</div></div>
    <div class="card"><h3>📊 Storylines</h3><div class="sub">What the numbers are saying</div>
      <div class="lead-row" style="flex-direction:column;align-items:flex-start;gap:5px"><span class="news-cat">Hot team</span><p style="color:var(--muted);font-size:14px;margin:0">Check the Power Index — the top 3 teams by win% are separating from the pack as the season heats up.</p></div>
      <div class="lead-row" style="flex-direction:column;align-items:flex-start;gap:5px"><span class="news-cat gold">Awards watch</span><p style="color:var(--muted);font-size:14px;margin:0">Jacob Misiorowski (MIL) leads the majors in strikeouts and ERA — a legitimate Cy Young candidate in 2026.</p></div>
      <div class="lead-row" style="flex-direction:column;align-items:flex-start;gap:5px;border:none;padding-bottom:0"><span class="news-cat hot">Injury watch</span><p style="color:var(--muted);font-size:14px;margin:0">Judge and Verlander both on the IL — follow the News tab for the latest updates.</p></div>
    </div>`;
}

/* player leaders */
const STAT_META={
  homeRuns:{label:'Home Runs',unit:'HR'},
  battingAverage:{label:'Batting Average',unit:'AVG'},
  rbi:{label:'RBI',unit:'RBI'},
  hits:{label:'Hits',unit:'H'},
  onBasePlusSlugging:{label:'OPS',unit:'OPS'},
  stolenBases:{label:'Stolen Bases',unit:'SB'},
  earnedRunAverage:{label:'ERA',unit:'ERA'},
  strikeOuts:{label:'Strikeouts',unit:'K'},
  wins:{label:'Wins',unit:'W'},
  saves:{label:'Saves',unit:'SV'},
  walksAndHitsPerInningPitched:{label:'WHIP',unit:'WHIP'},
};
const BAT_ORDER=['homeRuns','battingAverage','rbi','hits','onBasePlusSlugging','stolenBases'];
const PIT_ORDER=['earnedRunAverage','strikeOuts','wins','saves','walksAndHitsPerInningPitched'];
function initials(n){const p=n.replace(/[.']/g,'').split(' ');return(p[0][0]+(p[p.length-1]?.[0]||'')).toUpperCase();}
function renderLeaders(){
  const src=curPType==='bat'?batLeaders:pitLeaders;
  const order=curPType==='bat'?BAT_ORDER:PIT_ORDER;
  if(!src){document.getElementById('leaderWrap').innerHTML='<div class="err">Leaders not loaded.</div>';return;}
  const byKey={};
  src.forEach(g=>{byKey[g.leaderCategory]=g.leaders||[];});
  document.getElementById('leaderWrap').innerHTML=order.map(key=>{
    const meta=STAT_META[key];if(!meta)return '';
    const rows=byKey[key]||[];
    if(!rows.length)return '';
    return `<div class="pl-card"><div class="pl-head"><h3>${meta.label}</h3><span class="unit">${meta.unit}</span></div>${
      rows.map((r,i)=>{
        const name=r.person?.fullName||'—';
        const tm=ab(r.team?.abbreviation||'');
        const val=r.value??'—';
        return `<div class="pl-row ${i===0?'top':''}"><span class="pl-rank">${r.rank||i+1}</span><span class="pl-ava" style="background:${TC[tm]||'#333'}">${initials(name)}</span><span class="pl-info"><div class="pl-name">${name}</div><div class="pl-meta">${teamName(tm)}</div></span><span class="pl-val">${val}</span></div>`;
      }).join('')
    }</div>`;
  }).filter(Boolean).join('');
}

/* news — live from ESPN MLB news API */
async function fetchNews(){
  document.getElementById('newsList').innerHTML='<div class="loading"><div class="spin"></div>Loading news…</div>';
  try{
    const espnUrl='https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/news?limit=12';
    const d=await mlbFetch(espnUrl);
    const arts=d.articles||[];
    if(!arts.length){document.getElementById('newsList').innerHTML='<div class="err">No news loaded.</div>';return;}
    const catColors={'Analysis':'','Awards Watch':'gold','Recap':'','Injury Report':'hot','Trade':'hot','Preview':''};
    document.getElementById('newsList').innerHTML=arts.map(a=>{
      const url=a.links?.web?.href||a.links?.mobile?.href||'#';
      const title=a.headline||'';
      const blurb=a.description||a.story||'';
      const cats=a.categories||[];
      const cat=cats.find(c=>c.type==='story')?.description||cats[0]?.description||'MLB';
      const shortCat=cat.length>18?'MLB News':cat;
      const pub=a.published?new Date(a.published):null;
      const age=pub?timeAgo(pub):'';
      const src=a.source?.id||'ESPN';
      const cls=shortCat.toLowerCase().includes('injur')?'hot':shortCat.toLowerCase().includes('award')?'gold':'';
      return `<a class="news-card" href="${url}" target="_blank" rel="noopener"><span class="news-cat ${cls}">${shortCat}</span><h4>${title}</h4>${blurb?`<p>${blurb.slice(0,160)}${blurb.length>160?'…':''}</p>`:''}<div class="news-meta"><span>${src} · ${age}</span><span class="arrow">Read →</span></div></a>`;
    }).join('');
  }catch(e){document.getElementById('newsList').innerHTML='<div class="err">Couldn\'t load news. Check back soon.</div>';}
}
function timeAgo(d){
  const s=Math.floor((Date.now()-d)/1000);
  if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function renderNews(){fetchNews();}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
});
document.querySelectorAll('#leagueSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#leagueSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');curLg=b.dataset.lg;renderStandings();});
document.querySelectorAll('#ptypeSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ptypeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');curPType=b.dataset.pt;renderLeaders();});

/* init */
renderDates();
renderNews();
Promise.all([
  fetchSchedule().catch(e=>console.warn('schedule:',e)),
  fetchStandings().catch(e=>console.warn('standings:',e)),
  fetchLeaders().catch(e=>console.warn('leaders:',e)),
]).then(()=>{
  renderGames();
  renderStandings();
  renderStats();
  renderLeaders();
  document.querySelector('.live-dot').innerHTML='<i></i>LIVE · '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
});
</script>
